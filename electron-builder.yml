appId: com.imprenta.calculadora
productName: Calculadora Imprenta
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Calculadora Imprenta
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icon.icns
linux:
  target:
    - target: AppImage
      arch:
        - x64
